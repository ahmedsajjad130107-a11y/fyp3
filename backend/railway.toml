# Railway: set this service’s Root Directory to `backend` in the dashboard so
# dependencies install from backend/requirements.txt and this file is picked up.
[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
